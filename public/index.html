<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BmskyAPIs</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f0f; color: #e6e6e6; line-height: 1.5; padding: 20px; max-width: 900px; margin: 0 auto; }
    nav { margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid #2a2a2a; }
    h1 { font-size: 1.5rem; color: #fff; }
    .cat { margin-bottom: 30px; }
    .cat-title { font-size: 1rem; color: #888; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
    .ep-wrap { margin-bottom: 10px; }
    .ep-btn { width: 100%; text-align: left; padding: 12px 16px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: 0.2s; }
    .ep-btn:hover { background: #252525; }
    .ep-wrap.open .ep-btn { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: none; background: #222; }
    .pg { background: #1a1a1a; border: 1px solid #333; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; padding: 20px; }
    .pg-form { margin-bottom: 20px; }
    .fields { margin-bottom: 15px; }
    .f { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; color: #ccc; font-size: 0.9rem; }
    input, textarea, select { width: 100%; padding: 10px 12px; background: #252525; border: 1px solid #3a3a3a; color: #fff; border-radius: 6px; font-size: 0.95rem; }
    textarea { resize: vertical; min-height: 80px; }
    .count { float: right; font-size: 0.8rem; color: #666; margin-top: 4px; }
    .run { width: 100%; padding: 12px; background: #2563eb; border: none; color: #fff; border-radius: 6px; font-size: 1rem; cursor: pointer; transition: 0.2s; }
    .run:hover { background: #1d4ed8; }
    .run:disabled { background: #334155; cursor: not-allowed; }
    .hint { margin-top: 8px; font-size: 0.85rem; color: #888; min-height: 1.2rem; }
    .pg-out { margin-top: 15px; }
    .status { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .chip { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; }
    .chip.ok { background: #1e3a2f; color: #4ade80; }
    .chip.bad { background: #3a1f1f; color: #f87171; }
    .dl { color: #60a5fa; text-decoration: none; font-size: 0.9rem; }
    details { background: #222; border-radius: 6px; margin-top: 10px; }
    summary { padding: 10px 14px; cursor: pointer; color: #ccc; font-size: 0.9rem; }
    .tech { padding: 0 14px 14px; }
    .tech-h { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 4px; font-size: 0.85rem; color: #888; }
    .ghost { background: none; border: none; color: #60a5fa; cursor: pointer; font-size: 0.85rem; }
    pre { background: #2a2a2a; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; line-height: 1.4; color: #d4d4d4; margin-top: 6px; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const EP_LIST = [
      { id: 'gemini', category: 'ai', title: 'Gemini AI', method: 'GET', path: '/api/gemini', result: { type: 'text', field: 'text' }, params: [
        { name: 'q', type: 'textarea', label: 'Pertanyaan', required: true, placeholder: 'Tulis pertanyaan…', value: '' }
      ] },
      { id: 'pinterest', category: 'search', title: 'Pinterest Search', method: 'GET', path: '/api/search/pinterest', result: { type: 'text', field: 'count' }, params: [
        { name: 'q', type: 'textarea', label: 'Kata Kunci', required: true, placeholder: 'Contoh: anime, kucing', value: '' }
      ] },
      { id: 'tiktok', category: 'download', title: 'TikTok Search', method: 'GET', path: '/api/download/tiktok', result: { type: 'text', field: 'count' }, params: [
        { name: 'q', type: 'textarea', label: 'Kata Kunci', required: true, placeholder: 'Contoh: kucing lucu', value: '' }
      ] }
    ];
    const LABELS = { ai: 'AI', search: 'Pencarian', download: 'Unduhan' };

    const el = (tag, cls, text) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    };
    const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

    function render() {
      const app = document.getElementById('app');
      app.innerHTML = '';

      const nav = el('nav');
      nav.append(el('h1', null, 'BmskyAPIs'));
      app.append(nav);

      const groups = {};
      EP_LIST.forEach(ep => {
        if (!groups[ep.category]) groups[ep.category] = [];
        groups[ep.category].push(ep);
      });

      for (const [cat, eps] of Object.entries(groups)) {
        const sec = el('section', 'cat');
        sec.append(el('h2', 'cat-title', LABELS[cat] || cap(cat)));
        eps.forEach(ep => {
          const wrap = el('div', 'ep-wrap');
          const btn = el('button', 'ep-btn', ep.title);
          wrap.append(btn);
          sec.append(wrap);
          let pg = null;
          btn.addEventListener('click', () => {
            document.querySelectorAll('.ep-wrap.open').forEach(w => { if (w !== wrap) w.classList.remove('open'); });
            wrap.classList.toggle('open');
            if (!pg) { pg = createPlayground(ep); wrap.append(pg); }
          });
        });
        app.append(sec);
      }
    }

    function createPlayground(ep) {
      const values = {};
      let busy = false, cooldown = null;

      const root = el('div', 'pg');
      root.innerHTML =
        '<div class="pg-form"><div class="fields"></div>' +
        '<button class="run" type="button">Kirim permintaan</button>' +
        '<p class="hint" role="status"></p></div>' +
        '<div class="pg-out">' +
          '<div class="status"><span class="chip"></span><a class="dl" target="_blank" rel="noopener" hidden>Buka hasil</a></div>' +
          '<details open><summary>Detail teknis</summary><div class="tech">' +
            '<div class="tech-h"><span>URL</span><button class="ghost copy" type="button">Salin</button></div><pre class="curl"></pre>' +
            '<div class="tech-h"><span>Hasil</span></div><pre class="out">Belum ada hasil.</pre>' +
          '</div></details>' +
        '</div>';

      const q = (sel) => root.querySelector(sel);
      const runBtn = q('.run'), hintEl = q('.hint');
      const chip = q('.chip'), dl = q('.dl'), out = q('.out'), curlEl = q('.curl');

      const val = (name) => String(values[name] || '').replace(/\s+/g, ' ').trim();
      const hint = (t) => { hintEl.textContent = t || ''; };

      ep.params.forEach(p => {
        const wrap = el('div', 'f');
        const id = ep.id + '-' + p.name;
        const lab = el('label', null, p.label + (p.required ? '' : ' (opsional)'));
        lab.htmlFor = id;
        let inp;
        if (p.type === 'select') {
          inp = el('select');
          (p.options || []).forEach(opt => {
            const o = el('option', null, opt.label || opt);
            o.value = opt.value || opt;
            if (opt.value === p.value) o.selected = true;
            inp.append(o);
          });
        } else if (p.type === 'textarea') {
          inp = el('textarea');
          inp.rows = 3;
        } else {
          inp = el('input');
          inp.type = p.type || 'text';
        }
        inp.id = id;
        inp.placeholder = p.placeholder || '';
        inp.value = p.value || '';
        values[p.name] = inp.value;

        let counter = null;
        if (p.max) counter = el('span', 'count', inp.value.length + '/' + p.max);
        inp.addEventListener('input', () => {
          values[p.name] = inp.value;
          if (counter) counter.textContent = inp.value.length + '/' + p.max;
          updateCurl();
        });
        if (p.type === 'textarea') {
          inp.addEventListener('keydown', ev => {
            if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); run(); }
          });
        }
        wrap.append(lab, inp);
        if (counter) wrap.append(counter);
        q('.fields').append(wrap);
      });

      function queryString() {
        const s = new URLSearchParams();
        ep.params.forEach(p => { const v = val(p.name); if (v) s.set(p.name, v); });
        return s.toString();
      }

      function updateCurl() {
        const params = ep.params.filter(p => val(p.name)).map(p => p.name + '=' + encodeURIComponent(val(p.name))).join('&');
        curlEl.textContent = location.origin + ep.path + (params ? '?' + params : '');
      }

      function setButton(label, disabled) { runBtn.textContent = label; runBtn.disabled = disabled; }
      function startCooldown(sec) {
        clearInterval(cooldown);
        let left = Math.max(1, Math.ceil(sec));
        setButton('Tunggu ' + left + ' dtk', true);
        cooldown = setInterval(() => {
          left--;
          if (left <= 0) { clearInterval(cooldown); setButton('Kirim permintaan', false); return; }
          setButton('Tunggu ' + left + ' dtk', true);
        }, 1000);
      }

      async function run() {
        if (busy) return;
        busy = true;
        setButton('Memproses…', true);
        chip.textContent = ''; chip.className = 'chip';
        dl.hidden = true;
        out.textContent = 'Memproses permintaan…';
        hint('');

        const t0 = performance.now();
        let status = 0, json = null, retry = 0;
        try {
          const r = await fetch(ep.path + '?' + queryString(), { headers: { accept: 'application/json' } });
          status = r.status;
          retry = Number(r.headers.get('retry-after')) || 0;
          const txt = await r.text();
          try { json = JSON.parse(txt); }
          catch (e) { json = { success: false, error: { message: 'Respons tidak valid' } }; }
        } catch (e) {
          json = { success: false, error: { message: 'Tidak dapat terhubung ke server' } };
        }
        const took = ((performance.now() - t0) / 1000).toFixed(1);

        out.textContent = JSON.stringify(json, null, 2);

        if (json && json.success) {
          chip.className = 'chip ok';
          chip.textContent = status + ' · ' + took + ' dtk';
          const findUrl = (obj) => {
            if (!obj) return null;
            if (typeof obj === 'string' && obj.startsWith('http')) return obj;
            if (Array.isArray(obj)) return findUrl(obj[0]);
            if (typeof obj === 'object') for (const v of Object.values(obj)) { const u = findUrl(v); if (u) return u; }
            return null;
          };
          const url = findUrl(json.data);
          if (url) { dl.href = url; dl.hidden = false; }
          startCooldown(5);
        } else {
          const m = (json && json.error && json.error.message) || 'Permintaan gagal.';
          chip.className = 'chip bad';
          chip.textContent = (status || 'ERR') + ' · ' + took + ' dtk';
          hint(m);
          startCooldown(status === 429 ? (retry || 60) : 3);
        }
        busy = false;
      }

      runBtn.addEventListener('click', run);
      q('.copy').addEventListener('click', async ev => {
        const b = ev.currentTarget;
        try { await navigator.clipboard.writeText(curlEl.textContent); b.textContent = 'Tersalin'; }
        catch (e) { b.textContent = 'Gagal menyalin'; }
        setTimeout(() => { b.textContent = 'Salin'; }, 1500);
      });

      updateCurl();
      return root;
    }

    render();
  </script>
</body>
</html>
