<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API Panel</title>
<style>
  :root {
    --bg: #f4f5f6;
    --surface: #ffffff;
    --ink: #1c2226;
    --muted: #66707a;
    --line: #dde1e5;
    --accent: #0f6b5c;
    --accent-ink: #ffffff;
    --code: #eef0f2;
    --error: #b3261e;
    --ok: #0f6b5c;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px;
  }
  .bar { max-width: 1100px; margin: 0 auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  #search {
    flex: 1 1 200px; min-width: 0;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    font: inherit; background: var(--bg);
  }
  #search:focus, input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chips { max-width: 1100px; margin: 10px auto 0; display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    padding: 4px 12px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  main {
    max-width: 1100px; margin: 0 auto; padding: 16px;
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr));
    align-items: start;
  }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px; min-width: 0;
  }
  .card h2 { margin: 0; font-size: 16px; font-weight: 650; display: flex; gap: 8px; align-items: baseline; }
  .tag { font-size: 12px; color: var(--muted); font-weight: 400; }
  .desc { margin: 2px 0 10px; color: var(--muted); font-size: 14px; }
  .row { display: flex; gap: 6px; align-items: stretch; }
  .endpoint {
    flex: 1; min-width: 0; font: 12.5px/1.4 var(--mono);
    background: var(--code); border-radius: 6px; padding: 7px 9px;
    overflow-x: auto; white-space: nowrap;
  }
  button.btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer;
    white-space: nowrap;
  }
  button.btn:hover { background: var(--bg); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:hover { background: #0b574b; }
  button.btn:disabled { opacity: .6; cursor: default; }
  .fields { display: grid; gap: 8px; margin: 12px 0; }
  label { display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
  input, textarea, select {
    width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
    font: inherit; color: var(--ink); background: var(--surface);
  }
  textarea { resize: vertical; min-height: 64px; }
  .actions { display: flex; gap: 8px; }
  .out { margin-top: 12px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .out[hidden] { display: none; }
  .out-head {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 6px 8px 6px 10px; background: var(--bg); border-bottom: 1px solid var(--line);
    font-size: 12.5px; color: var(--muted);
  }
  .status-ok { color: var(--ok); font-weight: 600; }
  .status-err { color: var(--error); font-weight: 600; }
  .out-body {
    max-height: 340px; overflow: auto; padding: 10px;
    overscroll-behavior: contain; background: var(--surface);
  }
  .out-body pre {
    margin: 0; font: 12.5px/1.5 var(--mono);
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .out-body img, .out-body video { display: block; max-width: 100%; max-height: 320px; margin: 0 auto; border-radius: 4px; }
  .out-body audio { width: 100%; }
  .out-body a { color: var(--accent); }
  .empty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 40px 0; }
  #toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 7px 14px; border-radius: 6px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  #toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>API Panel</h1>
    <input id="search" type="search" placeholder="Search endpoints" aria-label="Search endpoints">
  </div>
  <div class="chips" id="chips"></div>
</header>
<main id="grid"></main>
<div id="toast" role="status"></div>

<script>
const MAX_SHOWN = 200000;
const state = { plugins: [], category: "all", query: "" };

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c);
  return n;
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1400);
}

async function copy(text, label) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = el("textarea", { style: "position:fixed;opacity:0" });
    ta.value = text;
    document.body.append(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
  toast(label + " copied");
}

function fmtSize(n) {
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}

const TEXT_TYPE = /^text\/|json|xml|javascript|x-www-form-urlencoded/i;

function card(p) {
  const inputs = {};
  const endpoint = el("code", { class: "endpoint" });
  const fields = el("div", { class: "fields" });
  const status = el("span");
  const meta = el("span");
  const body = el("div", { class: "out-body" });
  const copyOut = el("button", { class: "btn", type: "button" }, "Copy response");
  const out = el("div", { class: "out", hidden: "" },
    el("div", { class: "out-head" }, el("span", {}, status, " ", meta), copyOut),
    body
  );
  const runBtn = el("button", { class: "btn primary", type: "button" }, "Run");
  let blobUrl = null;
  let copyValue = "";

  const buildUrl = () => {
    const q = new URLSearchParams();
    for (const prm of p.params) {
      const v = inputs[prm.name].value.trim();
      if (v) q.set(prm.name, v);
    }
    const s = q.toString();
    return location.origin + "/api/" + encodeURIComponent(p.name) + (s ? "?" + s : "");
  };
  const refresh = () => { endpoint.textContent = buildUrl(); };

  for (const prm of p.params) {
    let input;
    if (prm.type === "select") {
      input = el("select", {}, (prm.options || []).map((o) => el("option", { value: o }, o)));
      if (prm.default !== undefined) input.value = prm.default;
    } else if (prm.type === "textarea") {
      input = el("textarea", { placeholder: prm.example || "" });
    } else {
      input = el("input", {
        type: prm.type === "number" ? "number" : "text",
        placeholder: prm.example || "",
        autocomplete: "off",
      });
      if (prm.default !== undefined) input.value = prm.default;
    }
    input.addEventListener("input", refresh);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && input.tagName !== "TEXTAREA") run();
    });
    inputs[prm.name] = input;
    fields.append(el("label", {}, (prm.label || prm.name) + (prm.required === false ? " (optional)" : ""), input));
  }

  async function run() {
    for (const prm of p.params) {
      if (prm.required !== false && prm.default === undefined && !inputs[prm.name].value.trim()) {
        inputs[prm.name].focus();
        return toast((prm.label || prm.name) + " is required");
      }
    }
    const url = buildUrl();
    runBtn.disabled = true;
    runBtn.textContent = "Running";
    const t0 = performance.now();
    if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
    try {
      const r = await fetch(url);
      const blob = await r.blob();
      const type = (r.headers.get("content-type") || blob.type || "").toLowerCase();
      const ms = Math.round(performance.now() - t0);
      status.className = r.ok ? "status-ok" : "status-err";
      status.textContent = r.status + " " + (r.statusText || "");
      meta.textContent = (type.split(";")[0] || "unknown") + " | " + fmtSize(blob.size) + " | " + ms + " ms";
      body.replaceChildren();
      copyValue = url;

      if (/^(image|video|audio)\//.test(type)) {
        blobUrl = URL.createObjectURL(blob);
        const tag = type.startsWith("image/") ? "img" : type.startsWith("video/") ? "video" : "audio";
        body.append(el(tag, tag === "img" ? { src: blobUrl, alt: "response" } : { src: blobUrl, controls: "" }));
        copyOut.textContent = "Copy endpoint";
      } else {
        let text = null;
        if (TEXT_TYPE.test(type) || !type) {
          text = await blob.text();
          if (!type && text.includes("\u0000")) text = null;
        }
        if (text !== null) {
          let shown = text;
          if (/json/.test(type) || /^\s*[\[{]/.test(text)) {
            try { shown = JSON.stringify(JSON.parse(text), null, 2); } catch {}
          }
          copyValue = shown;
          const clipped = shown.length > MAX_SHOWN;
          body.append(el("pre", {}, clipped ? shown.slice(0, MAX_SHOWN) + "\n\n[Output truncated. Use Copy response for the full text.]" : shown));
          copyOut.textContent = "Copy response";
        } else {
          blobUrl = URL.createObjectURL(blob);
          body.append(el("a", { href: blobUrl, download: p.name }, "Download file (" + fmtSize(blob.size) + ")"));
          copyOut.textContent = "Copy endpoint";
        }
      }
    } catch (e) {
      status.className = "status-err";
      status.textContent = "Request failed";
      meta.textContent = "";
      body.replaceChildren(el("pre", {}, String(e.message || e)));
      copyValue = String(e.message || e);
      copyOut.textContent = "Copy response";
    } finally {
      out.hidden = false;
      runBtn.disabled = false;
      runBtn.textContent = "Run";
    }
  }

  runBtn.addEventListener("click", run);
  copyOut.addEventListener("click", () => copy(copyValue, copyOut.textContent.replace("Copy ", "")));
  refresh();

  return el("section", { class: "card" },
    el("h2", {}, p.name, el("span", { class: "tag" }, p.category + " | " + p.method)),
    el("p", { class: "desc" }, p.description || ""),
    el("div", { class: "row" }, endpoint,
      el("button", { class: "btn", type: "button", onclick: () => copy(buildUrl(), "Endpoint") }, "Copy endpoint")),
    fields,
    el("div", { class: "actions" }, runBtn),
    out
  );
}

function render() {
  const q = state.query.toLowerCase();
  const list = state.plugins.filter((p) =>
    (state.category === "all" || p.category === state.category) &&
    (!q || (p.name + " " + p.description + " " + p.category).toLowerCase().includes(q))
  );
  const grid = document.getElementById("grid");
  grid.replaceChildren(...(list.length ? list.map(card) : [el("div", { class: "empty" }, "No endpoints found. Add a file to the plugins folder.")]));
}

function renderChips() {
  const cats = ["all", ...new Set(state.plugins.map((p) => p.category))];
  document.getElementById("chips").replaceChildren(
    ...cats.map((c) => el("button", {
      class: "chip", type: "button", "aria-pressed": String(c === state.category),
      onclick: () => { state.category = c; renderChips(); render(); },
    }, c))
  );
}

document.getElementById("search").addEventListener("input", (e) => {
  state.query = e.target.value;
  render();
});

fetch("/meta/plugins")
  .then((r) => r.json())
  .then((data) => { state.plugins = data; renderChips(); render(); })
  .catch(() => {
    document.getElementById("grid").replaceChildren(el("div", { class: "empty" }, "Could not load plugins from the server."));
  });
</script>
</body>
</html>
