<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API Panel</title>
<style>
  :root {
    --bg: #f4f5f6;
    --surface: #ffffff;
    --ink: #1c2226;
    --muted: #66707a;
    --line: #dde1e5;
    --accent: #0f6b5c;
    --accent-ink: #ffffff;
    --code: #eef0f2;
    --error: #b3261e;
    --ok: #0f6b5c;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px;
  }
  .bar { max-width: 760px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
  h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; }
  #search {
    flex: 1; min-width: 0;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    font: inherit; background: var(--bg);
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; display: grid; gap: 10px; }

  /* Categories */
  .cat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .cat-btn {
    width: 100%; display: flex; align-items: center; gap: 10px;
    padding: 14px; border: 0; background: none; color: inherit;
    font: inherit; font-weight: 650; text-align: left; cursor: pointer;
    text-transform: capitalize;
  }
  .cat-btn:hover { background: var(--bg); }
  .cat-count { margin-left: auto; font-weight: 400; font-size: 13px; color: var(--muted); text-transform: none; }
  .chev {
    width: 8px; height: 8px; flex: none;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(-45deg); transition: transform .12s;
  }
  .cat-btn[aria-expanded="true"] .chev { transform: rotate(45deg); }
  .feat-list[hidden] { display: none; }

  /* Feature rows */
  .feat {
    width: 100%; display: flex; align-items: baseline; gap: 10px;
    padding: 11px 14px; border: 0; border-top: 1px solid var(--line);
    background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .feat:hover { background: var(--bg); }
  .feat-name { font-weight: 600; }
  .feat-desc { color: var(--muted); font-size: 14px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: 12px; color: var(--muted); font-weight: 400; }

  /* Buttons and fields */
  .row { display: flex; gap: 6px; align-items: stretch; }
  .endpoint {
    flex: 1; min-width: 0; font: 12.5px/1.4 var(--mono);
    background: var(--code); border-radius: 6px; padding: 7px 9px;
    overflow-x: auto; white-space: nowrap;
  }
  button.btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer;
    white-space: nowrap;
  }
  button.btn:hover { background: var(--bg); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:hover { background: #0b574b; }
  button.btn:disabled { opacity: .6; cursor: default; }
  .desc { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
  .fields { display: grid; gap: 8px; margin: 12px 0; }
  label { display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
  input, textarea, select {
    width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
    font: inherit; color: var(--ink); background: var(--surface);
  }
  textarea { resize: vertical; min-height: 64px; }

  /* Response panel (scrolls inside) */
  .out { margin-top: 12px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .out[hidden] { display: none; }
  .out-head {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 6px 8px 6px 10px; background: var(--bg); border-bottom: 1px solid var(--line);
    font-size: 12.5px; color: var(--muted);
  }
  .status-ok { color: var(--ok); font-weight: 600; }
  .status-err { color: var(--error); font-weight: 600; }
  .out-body { max-height: 320px; overflow: auto; padding: 10px; overscroll-behavior: contain; }
  .out-body pre { margin: 0; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .out-body img, .out-body video { display: block; max-width: 100%; max-height: 300px; margin: 0 auto; border-radius: 4px; }
  .out-body audio { width: 100%; }
  .out-body a { color: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }

  /* Popup */
  dialog {
    border: 0; border-radius: 10px; padding: 0;
    width: min(640px, calc(100vw - 24px));
    max-height: calc(100dvh - 24px);
    background: var(--surface); color: var(--ink);
    box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
  }
  dialog::backdrop { background: rgba(20, 26, 30, .5); }
  .dlg-wrap { display: flex; flex-direction: column; max-height: calc(100dvh - 24px); }
  .dlg-head {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 12px 14px; border-bottom: 1px solid var(--line);
  }
  .dlg-head h2 { margin: 0; font-size: 16px; font-weight: 650; }
  .dlg-body { overflow: auto; padding: 14px; overscroll-behavior: contain; }

  #toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 7px 14px; border-radius: 6px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 10;
  }
  #toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #toast, .chev { transition: none; } }
  /* Share popup (@BimaSky) */
  .share-backdrop { position: fixed; inset: 0; background: rgba(20,26,30,.55); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .share-dlg { background: var(--surface); border-radius: 12px; width: min(460px, 100%); max-height: calc(100dvh - 32px); overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  .share-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .share-x { border: 0; background: none; font-size: 20px; cursor: pointer; color: var(--muted); padding: 0 4px; }
  .share-body { padding: 14px; display: grid; gap: 10px; }
  .share-card { width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; }
  .share-name { font: 600 15px var(--mono); }
  .share-desc { color: var(--muted); font-size: 13.5px; }
  .share-url { font: 12.5px/1.4 var(--mono); background: var(--code); border-radius: 6px; padding: 8px 10px; overflow-wrap: anywhere; }
  .share-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .share-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 8px 14px; font: inherit; font-size: 13.5px; cursor: pointer; }
  .share-btn:hover { background: var(--bg); }
  .share-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .share-hint { color: var(--muted); font-size: 12.5px; }
  .share-toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(8px); background: var(--ink); color: #fff; padding: 7px 14px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s, transform .2s; z-index: 100; pointer-events: none; }
  .share-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>API Panel</h1>
    <input id="search" type="search" placeholder="Search endpoints" aria-label="Search endpoints">
  </div>
</header>
<main id="list"></main>

<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-wrap">
    <div class="dlg-head">
      <div>
        <h2 id="dlg-title"></h2>
        <span class="tag" id="dlg-meta"></span>
      </div>
      <button class="btn" id="dlg-close" type="button">Close</button>
    </div>
    <div class="dlg-body" id="dlg-body"></div>
  </div>
</dialog>

<div id="toast" role="status"></div>

<script>
const MAX_SHOWN = 200000;
const TEXT_TYPE = /^text\/|json|xml|javascript|x-www-form-urlencoded/i;
const state = { plugins: [], query: "", open: new Set() };
const dlg = document.getElementById("dlg");
let disposeActive = null;

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c);
  return n;
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  // The popup lives in the top layer, so the toast must move inside it while it is open.
  (dlg.open ? dlg : document.body).append(t);
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1400);
}

async function copy(text, label) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = el("textarea", { style: "position:fixed;opacity:0" });
    ta.value = text;
    (dlg.open ? dlg : document.body).append(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
  toast(label + " copied");
}

function fmtSize(n) {
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}

/* ---------- Playground (shown inside the popup) ---------- */
function buildPlayground(p) {
  const inputs = {};
  const endpoint = el("code", { class: "endpoint" });
  const fields = el("div", { class: "fields" });
  const status = el("span");
  const meta = el("span");
  const body = el("div", { class: "out-body" });
  const copyOut = el("button", { class: "btn", type: "button" }, "Copy response");
  const out = el("div", { class: "out", hidden: "" },
    el("div", { class: "out-head" }, el("span", {}, status, " ", meta), copyOut),
    body
  );
  const runBtn = el("button", { class: "btn primary", type: "button" }, "Run");
  let blobUrl = null;
  let copyValue = "";

  const buildUrl = () => {
    const q = new URLSearchParams();
    for (const prm of p.params) {
      const v = inputs[prm.name].value.trim();
      if (v) q.set(prm.name, v);
    }
    const s = q.toString();
    return location.origin + "/api/" + encodeURIComponent(p.name) + (s ? "?" + s : "");
  };
  const refresh = () => { endpoint.textContent = buildUrl(); };
  const freeBlob = () => { if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; } };

  for (const prm of p.params) {
    let input;
    if (prm.type === "select") {
      input = el("select", {}, (prm.options || []).map((o) => el("option", { value: o }, o)));
      if (prm.default !== undefined) input.value = prm.default;
    } else if (prm.type === "textarea") {
      input = el("textarea", { placeholder: prm.example || "" });
    } else {
      input = el("input", {
        type: prm.type === "number" ? "number" : "text",
        placeholder: prm.example || "",
        autocomplete: "off",
      });
      if (prm.default !== undefined) input.value = prm.default;
    }
    input.addEventListener("input", refresh);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && input.tagName !== "TEXTAREA") run();
    });
    inputs[prm.name] = input;
    fields.append(el("label", {}, (prm.label || prm.name) + (prm.required === false ? " (optional)" : ""), input));
  }

  async function run() {
    for (const prm of p.params) {
      if (prm.required !== false && prm.default === undefined && !inputs[prm.name].value.trim()) {
        inputs[prm.name].focus();
        return toast((prm.label || prm.name) + " is required");
      }
    }
    const url = buildUrl();
    runBtn.disabled = true;
    runBtn.textContent = "Running";
    const t0 = performance.now();
    freeBlob();
    try {
      const r = await fetch(url);
      const blob = await r.blob();
      const type = (r.headers.get("content-type") || blob.type || "").toLowerCase();
      const ms = Math.round(performance.now() - t0);
      status.className = r.ok ? "status-ok" : "status-err";
      status.textContent = r.status + " " + (r.statusText || "");
      meta.textContent = (type.split(";")[0] || "unknown") + " | " + fmtSize(blob.size) + " | " + ms + " ms";
      body.replaceChildren();
      copyValue = url;

      if (/^(image|video|audio)\//.test(type)) {
        blobUrl = URL.createObjectURL(blob);
        const tag = type.startsWith("image/") ? "img" : type.startsWith("video/") ? "video" : "audio";
        body.append(el(tag, tag === "img" ? { src: blobUrl, alt: "response" } : { src: blobUrl, controls: "" }));
        copyOut.textContent = "Copy endpoint";
      } else {
        let text = null;
        if (TEXT_TYPE.test(type) || !type) {
          text = await blob.text();
          if (!type && text.includes("\u0000")) text = null;
        }
        if (text !== null) {
          let shown = text;
          if (/json/.test(type) || /^\s*[\[{]/.test(text)) {
            try { shown = JSON.stringify(JSON.parse(text), null, 2); } catch {}
          }
          copyValue = shown;
          const clipped = shown.length > MAX_SHOWN;
          body.append(el("pre", {}, clipped ? shown.slice(0, MAX_SHOWN) + "\n\n[Output truncated. Use Copy response for the full text.]" : shown));
          copyOut.textContent = "Copy response";
        } else {
          blobUrl = URL.createObjectURL(blob);
          body.append(el("a", { href: blobUrl, download: p.name }, "Download file (" + fmtSize(blob.size) + ")"));
          copyOut.textContent = "Copy endpoint";
        }
      }
    } catch (e) {
      status.className = "status-err";
      status.textContent = "Request failed";
      meta.textContent = "";
      body.replaceChildren(el("pre", {}, String(e.message || e)));
      copyValue = String(e.message || e);
      copyOut.textContent = "Copy response";
    } finally {
      out.hidden = false;
      runBtn.disabled = false;
      runBtn.textContent = "Run";
    }
  }

  runBtn.addEventListener("click", run);
  copyOut.addEventListener("click", () => copy(copyValue, copyOut.textContent.replace("Copy ", "")));
  refresh();

  const node = el("div", {},
    p.description ? el("p", { class: "desc" }, p.description) : null,
    el("div", { class: "row" }, endpoint,
      el("button", { class: "btn", type: "button", onclick: () => copy(buildUrl(), "Endpoint") }, "Copy endpoint")),
    fields,
    runBtn,
    out
  );
  return { node, dispose: freeBlob };
}

function openPlayground(p) {
  const pg = buildPlayground(p);
  disposeActive = pg.dispose;
  document.getElementById("dlg-title").textContent = p.name;
  document.getElementById("dlg-meta").textContent = p.category + " | " + p.method;
  document.getElementById("dlg-body").replaceChildren(pg.node);
  dlg.showModal();
  const first = pg.node.querySelector("input, textarea, select");
  if (first) first.focus();
}

dlg.addEventListener("close", () => {
  if (disposeActive) disposeActive();
  disposeActive = null;
  document.getElementById("dlg-body").replaceChildren();
});
dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
document.getElementById("dlg-close").addEventListener("click", () => dlg.close());

/* ---------- Category list ---------- */
function render() {
  const q = state.query.trim().toLowerCase();
  const groups = new Map();
  for (const p of [...state.plugins].sort((a, b) => a.name.localeCompare(b.name))) {
    if (q && !(p.name + " " + (p.description || "") + " " + p.category).toLowerCase().includes(q)) continue;
    if (!groups.has(p.category)) groups.set(p.category, []);
    groups.get(p.category).push(p);
  }

  const list = document.getElementById("list");
  if (!groups.size) {
    list.replaceChildren(el("div", { class: "empty" },
      state.plugins.length ? "No endpoints match your search." : "No endpoints yet. Add a file to the plugins folder."));
    return;
  }

  const sections = [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([cat, items]) => {
    const expanded = q ? true : state.open.has(cat);
    const panel = el("div", { class: "feat-list", id: "cat-" + cat, hidden: expanded ? null : "" },
      items.map((p) => el("button", { class: "feat", type: "button", onclick: () => openPlayground(p) },
        el("span", { class: "feat-name" }, p.name),
        el("span", { class: "feat-desc" }, p.description || ""),
        el("span", { class: "tag" }, p.method)
      ))
    );
    const btn = el("button", {
      class: "cat-btn", type: "button",
      "aria-expanded": String(expanded), "aria-controls": "cat-" + cat,
      onclick: () => {
        const open = btn.getAttribute("aria-expanded") !== "true";
        btn.setAttribute("aria-expanded", String(open));
        panel.hidden = !open;
        if (open) state.open.add(cat); else state.open.delete(cat);
      },
    }, el("span", { class: "chev" }), cat, el("span", { class: "cat-count" }, items.length + (items.length === 1 ? " endpoint" : " endpoints")));
    return el("section", { class: "cat" }, btn, panel);
  });
  list.replaceChildren(...sections);
}

document.getElementById("search").addEventListener("input", (e) => {
  state.query = e.target.value;
  render();
});

fetch("/meta/plugins")
  .then((r) => r.json())
  .then((data) => { state.plugins = data; render(); })
  .catch(() => {
    document.getElementById("list").replaceChildren(el("div", { class: "empty" }, "Could not load plugins from the server."));
  });
</script>
<script src="/share.js" defer></script>
</body>
</html>
